<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Muhammad Bin Javed — Front-End Architect & Python Developer. Router initializing.">
    <meta name="theme-color" content="#FAFAF9">
    <link rel="icon" type="image/svg+xml" href="shared/favicon.svg">
    <title>Muhammad Bin Javed | Initializing...</title>
    <style>
        body { background: #FAFAF9; color: #292524; display: flex; height: 100vh; align-items: center; justify-content: center; margin: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        .loader { width: 44px; height: 44px; border: 3px solid #E7E5E4; border-bottom-color: #F97316; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .loader { animation-duration: 1.6s; } }
    </style>
    <script>
        (function() {
            var width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
            if (width < 768) {
                window.location.replace("./mobile/index.html");
            } else {
                window.location.replace("./desktop/index.html");
            }
        })();
    </script>
</head>
<body>
    <div class="loader" role="status" aria-label="Loading"></div>
    <noscript>
        <p style="position:absolute;bottom:2rem;width:100%;text-align:center;font-family:'Segoe UI',Arial,sans-serif;color:#78716C;">
            JavaScript is disabled. Please open the <a href="./desktop/index.html" style="color:#EA580C;">desktop</a> or <a href="./mobile/index.html" style="color:#EA580C;">mobile</a> experience directly.
        </p>
    </noscript>
</body>
</html>
