<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Contact Muhammad Bin Javed directly via WhatsApp — +92 332 8662897.">
    <meta name="theme-color" content="#FAFAF9">
    <link rel="icon" type="image/svg+xml" href="../shared/favicon.svg">
    <title>Muhammad Bin Javed | Contact Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@600;700&family=Josefin+Sans:wght@300;400;600;700&family=Metamorphous&display=swap" as="style">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>

    <header class="m-header">
        <a href="index.html" class="m-back">← BACK</a>
        <a href="https://wa.me/923328662897" target="_blank" rel="noopener" class="m-cta-mini">WhatsApp</a>
    </header>

    <section class="m-portal">
        <span class="portal-badge">DIRECT LINE</span>
        <h1 class="portal-title">
            CONTACT <span class="highlight-orange">PORTAL</span>
            <span class="portal-sub">SEND STRAIGHT TO WHATSAPP</span>
        </h1>
        <p class="portal-intro">
            Fill the form and your message goes straight to my WhatsApp <strong class="hl">+92 332 8662897</strong>. Fast, direct, ready in seconds.
        </p>

        <form id="contactForm" class="portal-form" novalidate>
            <div class="form-field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required autocomplete="name" placeholder="Your full name" aria-required="true">
            </div>
            <div class="form-field">
                <label for="email">Email <span class="label-opt">(optional)</span></label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com">
            </div>
            <div class="form-field">
                <label for="msg">Message</label>
                <textarea id="msg" name="msg" rows="4" required placeholder="Tell me about your project..." aria-required="true"></textarea>
            </div>
            <button type="submit" class="btn-primary btn-send">Send via WhatsApp ↗</button>
            <p class="form-note" id="formNote" hidden aria-live="polite"></p>
        </form>

        <div class="portal-alt">
            <a href="https://wa.me/923328662897" target="_blank" rel="noopener" class="contact-link">
                <span>WhatsApp</span>
                <strong>+92 332 8662897</strong>
            </a>
            <a href="mailto:dev.muhammad.khan.laghari@gmail.com" class="contact-link">
                <span>Email</span>
                <strong>dev.muhammad.khan.laghari@gmail.com</strong>
            </a>
        </div>
    </section>

    <footer class="site-footer">
        <span>© 2026 MUHAMMAD BIN JAVED</span>
        <a href="index.html">← BACK TO PORTFOLIO</a>
    </footer>

    <script src="js/contact.js" defer></script>
</body>
</html>
